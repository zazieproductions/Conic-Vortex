  </text>
  
  <!-- Decorative lines -->
  <line x1="100" y1="400" x2="1180" y2="400" stroke="#ff0000" stroke-width="1"/>
  <line x1="100" y1="420" x2="1180" y2="420" stroke="#00ffff" stroke-width="1"/>
</svg>